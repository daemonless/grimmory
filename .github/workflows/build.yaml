name: Build Grimmory Container

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Tag to rebuild (blank = all)'
        required: false
        type: string

jobs:
  build:
    uses: daemonless/workflows/.github/workflows/daemonless-build.yaml@v1
    with:
      image_name: grimmory
      variant: ${{ inputs.variant }}
    secrets: inherit
